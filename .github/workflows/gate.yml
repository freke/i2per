# The gate, in three jobs that answer three different questions.
#
#   smoke     "does the router still work?"  -- every push and every pull
#             request. The partition is every CT suite except the two that are
#             too slow to run on every push, plus the whole unit layer.
#   gate      "is this commit good enough to ship?" -- `main` only, and it runs
#             everything: lint, docs, dialyzer, every eunit, every property,
#             every CT suite, no time limit.
#   compat    "can someone run this on another OTP?" -- every pull request and
#             `main`, but not a push to a feature branch.
#
# Separate jobs rather than one job with a matrix, because a matrix of the pinned
# version answers the compat question with the smoke job's strictness -- which is
# why the README warns that a different OTP produces warnings this one does not.
# `warnings_as_errors` is the *only* thing separating them, so folding them
# together would make "fails on an older OTP" and "fails on a lint regression"
# the same red mark.
#
# %%%%% Tiers, not shards %%%%%
#
# A push runs the **smoke tier** and nothing else. A pull request runs the same
# smoke job plus `compat`, because a PR is asking "would this merge cleanly" and
# an OTP matrix is part of that answer before the merge rather than after.
#
# `main` runs **everything**: lint, docs, dialyzer, every eunit module
# including the property layer, every CT suite.
#
# **What the smoke tier costs, measured not estimated.** 79s of CT and 10s of
# eunit here, across every suite but the slow two. The `gate (pinned toolchain)`
# job on this workflow's last pull-request run took **162s** on a runner for a
# smaller payload, which puts the smoke job at roughly 4-5 minutes against a
# 5-minute budget. **That margin is thin and the figure is extrapolated, so it is
# stated rather than asserted** -- the first push that runs this workflow should
# be read for its real wall time, and the partition widened or narrowed on the
# measurement rather than on this paragraph.
#
# **Case counts are not written down here, and this file used to be full of
# them.** It claimed 951 eunit across 935 unit and 16 property, and 224 CT --
# every one of them wrong when written, and rebar3 prints the totals it actually
# ran. A figure in a workflow comment cannot be checked against the run it
# describes, which is the same defect as a second copy of anything else. The
# `Report the tiers` step below prints the partition from the scripts that derive
# it, so the number in the log is never older than the log. #STMC7NC.
#
# **What the smoke tier does not run, stated rather than implied.** Two suites:
# `i2p_peer_transport_SUITE` (protocol-mandated connect timeouts and backoff) and
# `i2p_ssu2_e2e_SUITE` (22,000 real encrypted datagrams through a live session
# pair). Together ~50s here and ~125s on a runner -- more than the entire budget,
# for two suites whose failures are about waiting rather than behaviour. A push
# that breaks one goes green here and red on `main`. That is the price of a
# five-minute signal, and it is chosen, not overlooked.
#
# **The suite lists live in `scripts/ct-suites.sh`** (CT) and
# `scripts/eunit-modules.sh` (eunit/PropEr), not here and not in the justfile,
# because three copies of a partition drift and a drifted partition is a gate
# that quietly stops running something.

# %%%%% Hermetic, always %%%%%
#
# **No job here runs i2pd, and none ever will.** `apps/i2per/interop/i2p_i2pd_interop_SUITE`
# boots a live i2pd and talks to a routable network; it is excluded from every tier
# by `scripts/ct-suites.sh`, which asserts that and fails rather than emitting it.
# rebar3 does not discover it either -- it sits outside a `test/` directory -- so
# it was never reachable from here in the first place.
#
# For the interoperability check, run `just interop` locally. Deliberately not a CI
# job and deliberately not `workflow_dispatch` either: a suite that needs the
# network is a suite whose failure means nothing when the network is what broke.
# Nothing in this workflow reaches the network.

# %%%%% Pinned action majors %%%%%
#
# `actions/checkout` v7, `cachix/install-nix-action` v31, `cachix/cachix-action`
# v17, `erlef/setup-beam` v1. Checked against the upstream releases, not assumed:
#
# - `cachix-action` v15 runs on **node20**, which GitHub is retiring. v17 is
#   node24. Not housekeeping -- v15 will stop working, and it is the action that
#   populates the devenv cache, so the failure mode is a 1m+ rebuild on every run.
#   Its input set is the same 12 with the same defaults, push behaviour included,
#   so this is a runtime bump and nothing else.
# - `install-nix-action` v31 adds one input (`set_as_trusted_user`) and changes
#   nothing this workflow passes.
# - `checkout` v5 -> node24; v6 persists credentials to a separate file; v7 blocks
#   fork checkouts under `pull_request_target` and `workflow_run`. The last does not
#   apply -- this workflow triggers on plain `pull_request`. v5+ needs a runner at
#   or above v2.327.1, which `ubuntu-latest` has long been.
# - `setup-beam` needs no bump: `@v1` is a floating major tag and is already
#   resolving to the newest 1.x. That is why it is written `@v1` and not a
#   specific version.

name: gate

# **Every** push, on every branch -- that is the whole point of the smoke job.
# Restricted to `main` (as this was) a feature branch gets nothing at all until
# someone opens a pull request, so the answer to "does this still work" arrives
# at the moment it is least useful.
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancels a superseded run on the same ref. A gate that reports a stale result is
# worse than one that takes longer, because the commit it names is not the commit
# that was tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # %%%%% The push tier %%%%%
  #
  # Runs on **every** push and every pull request, not just `main`. The question
  # it answers is the one an operator has while the change is still being made:
  # does the router come up and work?
  #
  # **The partition is derived from the tree**, so a new CT suite is in tomorrow's
  # smoke run unless someone deliberately puts it in `slow`. That inverts the usual
  # failure: with a hand-written list, the edit that adds a suite is the moment
  # someone decides it does not matter yet.
  smoke:
    name: smoke (lint + unit + CT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        # Not a hardcoded list of versions. The versions live in devenv.nix, so
        # this job and a developer's shell cannot disagree about which OTP a
        # warning was measured against -- which is the drift the README warns
        # about. The nix cache is the cost of doing it this way.
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install the devenv CLI
        # Named apart from "Install the pinned toolchain" above, which installs
        # nix itself. Separate from the steps that use this because it *does*
        # persist: Actions steps share `$HOME`, so the profile is on PATH for
        # every step after this one. The devenv *environment* does not -- below.
        run: nix profile install nixpkgs#devenv

      - name: Verify the pinned toolchain
        # **Every step that needs the toolchain re-enters it.** A GitHub Actions
        # `run:` block is a fresh shell, so `devenv shell` exporting variables
        # does nothing for the steps that follow. This step exists so a toolchain
        # that failed to build fails *here*, naming itself, rather than two steps
        # later as "rebar3: command not found".
        run: devenv shell -- bash -c 'command -v rebar3 && command -v erlfmt && command -v just'

      - name: Report the tiers
        # Printed rather than hidden, so a red run names the partition it ran
        # without anybody opening the script. A gate whose scope is invisible is a
        # gate whose scope gets misremembered.
        run: |
          echo "::group::tiers"
          echo "  eunit unit : $(bash scripts/eunit-modules.sh unit | tr ',' '\n' | wc -l) modules"
          echo "  eunit prop : $(bash scripts/eunit-modules.sh prop | tr ',' '\n' | wc -l) modules (main only)"
          echo "  CT smoke   : $(bash scripts/ct-suites.sh smoke | tr ',' '\n' | wc -l) suites"
          echo "  CT slow    : $(bash scripts/ct-suites.sh slow | tr ',' '\n' | wc -l) suites (main only)"
          echo "  CT all     : $(bash scripts/ct-suites.sh all | tr ',' '\n' | wc -l) suites"
          echo "::endgroup::"

      - name: just smoke-test
        # lint + every unit module + every CT suite but the slow two. Invoked
        # through `just` rather than spelled out here so CI and a developer run
        # the same list: a gate that is written twice is a gate that is checked
        # once.
        #
        # `--sname` is inside the recipe, because `apps/i2per_status_SUITE` spawns
        # a `peer` router node and fails loudly without a dist-enabled CT node.
        run: devenv shell -- just smoke-test

  # %%%%% The main tier %%%%%
  #
  # `main` only. Everything, no time limit: lint, docs, dialyzer, every eunit
  # including the property layer, and all 25 CT suites including the two the
  # smoke tier holds back.
  #
  # **Separate from `smoke` rather than a superset step in it.** On `main` the
  # smoke job has already answered "does it work"; what is left is the slower,
  # less often-failing half, and running them as one job would make the fast
  # answer wait for the slow one.
  full:
    name: full gate (lint + docs + dialyzer + every test)
    runs-on: ubuntu-latest
    needs: smoke
    # **`main` only, by ref rather than by event.** `github.event_name !=
    # 'pull_request'` would also let a `workflow_dispatch` -- which a human can
    # fire on any branch -- run the full gate, and the rule is about the code
    # being on `main`, not about how the run was started.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install the devenv CLI
        run: nix profile install nixpkgs#devenv

      - name: just test
        # lint + docs + every eunit module + every CT suite + the merged coverage
        # report. Unattended, so the time is not a cost.
        #
        # **The property layer runs here and not in `smoke`, deliberately.** They
        # are 0.23s of work, so runtime is not the reason. The reason is that a
        # property test finds its counterexample from a *random* input: a failure
        # on a push is a bug report that arrives before anyone can reproduce it,
        # and re-rolling the seed is the tempting response to a red that keeps
        # flickering. On `main`, where a red is investigated rather than re-rolled,
        # that is the right place for it.
        run: devenv shell -- just test

      - name: just proper
        # Explicitly, and separately from `just test` which already includes it.
        # A property failure on `main` is the one failure class where "which seed"
        # matters, and this step's log is where the module name is legible next to
        # the counterexample rather than buried in a 224-case CT summary.
        run: devenv shell -- just proper

      - name: just dialyzer
        # `main` only, where there is time for it. It analyses source, not tests,
        # so its answer does not depend on which CT tier ran.
        #
        # **Invoked directly rather than through `just check`, which now includes
        # dialyzer.** This step runs after `just test`, so taking it through
        # `check` would run the tests a second time; the ordering here is also why
        # `check` puts dialyzer *before* `test` locally — a type error should fail
        # the gate before it spends four minutes on suites.
        run: devenv shell -- just dialyzer

  # %%%%% The compatibility job %%%%%
  #
  # **Warnings are not fatal here, from day one.** That is not a relaxation
  # discovered later -- it is the only thing that makes this job a different
  # question from `full`. A compatibility matrix that failed on warnings would
  # report an older OTP as broken when the code is fine, and the natural
  # response would be to delete the matrix.
  #
  # **Only OTP varies.** rebar3 is pinned per job, because varying the tooling
  # multiplies the matrix without answering anything about the runtime.
  #
  # **This job does not install or run `erlfmt`.** Formatting is the pinned
  # job's question, and the same source through the same formatter version gives
  # the same answer twice. It used to install a pinned `erlfmt` here and never
  # invoke it -- under a comment claiming a `-check` that no step contained, from a
  # repository URL that does not resolve. If formatting ever *should* be
  # checked per-OTP, that is a deliberate addition, not a repair of this.
  #
  # **Smoke tier, not the full one.** A different OTP is a question about whether
  # the code runs there at all, so the answer is the partition that establishes
  # "it runs". The full tier would make this job four times slower than the
  # question it answers.
  #
  # Starts at one version, the same as devenv, because a matrix nobody has run
  # is a matrix of guesses. Expansion is 1.0.0 material.
  #
  # **A pull request or `main`, by ref rather than by event.** Same rule and the
  # same reason as `full`: the question is about the code, and
  # `github.event_name` would also let a `workflow_dispatch` -- which a human can
  # fire on any branch -- run this job. It is *not* the same condition as
  # `full`'s, because a pull request asks "would this merge cleanly" and an OTP
  # matrix is part of that answer before the merge rather than after.
  #
  # A push to a feature branch is excluded because it asks neither question: it
  # is someone working, and the run it does get is the five-minute smoke tier.
  # Left unconditioned, every such push also paid a checkout, an OTP 28 install,
  # a smoke-tier compile, the unit tier, CT and dialyzer -- so the push tier was
  # neither the one documented above nor the one anybody would choose if they had
  # been asked.
  compat:
    name: compat (OTP ${{ matrix.otp }}, warnings relaxed)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/pull/')
    strategy:
      # One version, so this job is reporting rather than surveying. `fail-fast:
      # false` is kept because the day a second version is added, the useful
      # report is all of them rather than only the first to fail.
      fail-fast: false
      matrix:
        include:
          - otp: "28"
            rebar3: "3.27.0"
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}

      - name: Compile, warnings not fatal
        # A fresh rebar config with `warnings_as_errors` dropped, rather than a
        # flag: there is no rebar3 flag for it, and editing rebar.config in place
        # would make the working tree dirty in a way the later steps could trip
        # over.
        run: |
          cp rebar.config /tmp/rebar.config.gate
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("rebar.config")
          s = p.read_text()
          # The project sets this in `{erl_opts, [...]}`. Removing just the
          # element, not the whole list, so every other option survives.
          s = re.sub(r",\s*warnings_as_errors", "", s)
          p.write_text(s)
          PY
          rebar3 compile
          diff -u /tmp/rebar.config.gate rebar.config || true

      - name: eunit (unit tier)
        # The unit layer only. This job's question is "does it run on this OTP",
        # and the in-process cases answer that; the property layer adds a
        # randomised dimension that would make a version difference look like a
        # flake.
        run: rebar3 as test eunit --module="$(bash scripts/eunit-modules.sh unit)"

      - name: ct (smoke tier)
        # The same partition the pinned job runs, from the same script.
        #
        # `--sname` gives the CT node a fixed distribution name, which
        # `apps/i2per_status/test/i2per_status_SUITE` needs to spawn a peer
        # router. Same reason as the justfile recipe.
        run: rebar3 ct --sname i2per_ct --suite="$(bash scripts/ct-suites.sh smoke)"

      - name: dialyzer
        # Still run. A compatibility job that skipped it would not answer "can
        # someone run this on another OTP" so much as "does it compile elsewhere".
        run: rebar3 dialyzer