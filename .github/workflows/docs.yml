# The documentation site, published to GitHub Pages.
#
# `just doc` generates the ExDoc site into the repo-root `doc/`, which is
# git-ignored -- generated output does not belong in history, and it is
# regenerated by every local `just doc` anyway. So the site has to be BUILT here
# to be published at all, which is why this workflow cannot be "just upload the
# doc/ directory": there is no doc/ directory until someone runs the build.
#
# %%%%% Why on a tag, and why that has a cost %%%%%
#
# The trigger is a **tag**, so the published site is the site for one specific
# release and cannot drift from what was cut. Publishing on every push to `main`
# would be the other defensible choice and it is a real trade: it makes doc
# changes visible between releases, at the cost of a site whose source links
# name a commit that is not the one any release shipped.
#
# The cost of tagging is stated here rather than discovered later: **between
# releases the site is not updated**, so a reader who lands on it is reading the
# last release, not `main`. That is the correct default for a protocol
# implementation -- the published docs should describe something an operator can
# actually run -- and it is the wrong default if the site is meant as a living
# reference. If that changes, the change is this trigger, not anything else.
#
# %%%%% source_ref, and dangling links %%%%%
#
# `docs/docs.exs` sets `source_ref: "v0.1.0"`, a **tag**. ExDoc turns that into
# links to `github.com/freke/i2per/blob/v0.1.0/...`. There are no tags in this
# repository yet, so on the first run every source link 404s. A page of broken
# links reads as a broken page, which is worse than a page without source links,
# so the version and tag are derived from the tag being built rather than read
# from the config, and the config's value is reported so the two cannot silently
# disagree.
#
# %%%%% The mermaid CDN dependency %%%%%
#
# The generated HTML injects mermaid from `cdn.jsdelivr.net`. That is a
# deliberate choice already made in `docs/docs.exs` and this workflow does not
# change it -- but the published site therefore depends on a third-party CDN
# being reachable from the reader's browser. Diagrams degrade to an error string
# if it is not, because the generated JS catches the render failure and says so.
# That is a real single point of failure for the diagrams and it is inherited,
# not introduced here.

name: docs

# Tag-triggered, so the site always corresponds to a release. See the header for
# why, and for what it costs between releases.
on:
  push:
    tags:
      - "v*"
  # Manual dispatch, so the site can be rebuilt for an existing tag without
  # cutting a new one. `git_ref` names which tag, so a rebuild is not ambiguous
  # about what it is publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build the docs for (e.g. v0.1.0)"
        required: true
        type: string

# Least privilege: this workflow reads the repository and writes a Pages site.
# It needs no write access to the repository's contents.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Two concurrent Pages deployments race for the same
# environment and the older one can win, publishing a stale site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the ExDoc site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the tag being published
        # `github.ref` is `refs/tags/v0.1.0` on a push, and the dispatch input
        # otherwise. Stripped to `v0.1.0` and exported so the source_ref and the
        # deployment description cannot name a different thing than was built.
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install the pinned toolchain
        # The same three steps the gate uses, for the same reason: the versions
        # live in devenv.nix rather than being restated here, so this workflow
        # and a developer's shell cannot disagree about which OTP the docs were
        # generated against.
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install the devenv CLI
        run: nix profile install nixpkgs#devenv

      - name: Verify the pinned toolchain
        # A GitHub Actions `run:` block is a fresh shell, so this fails HERE
        # rather than two steps later as "rebar3: command not found".
        run: devenv shell -- bash -c 'command -v rebar3 && command -v erlfmt && command -v just'

      - name: Report the configured source_ref
        # `docs/docs.exs` hardcodes `source_ref: "v0.1.0"`. The generated site
        # links source to that tag. Printing it next to the tag actually being
        # built is the whole point of this step: if they disagree, the site is
        # about to publish links that point somewhere else, and that is visible
        # in the run log rather than only in a broken link on a page.
        run: |
          set -euo pipefail
          echo "::group::version"
          echo "  building tag        : ${{ steps.version.outputs.tag }}"
          echo "  app version         : $(grep -oP '\{vsn, "\K[^"]+' apps/i2per/src/i2per.app.src)"
          echo "  docs.exs source_ref : $(grep -oP 'source_ref: "\K[^"]+' docs/docs.exs)"
          echo "::endgroup::"

      - name: Build the site
        # Through `just doc` rather than `scripts/gen-docs.sh` spelled out, so CI
        # and a developer run the same recipe. A build step written twice is a
        # build step checked once.
        run: devenv shell -- just doc

      - name: Verify the site is not empty
        # The failure this guards against is the quiet one: ExDoc exiting 0
        # having written nothing, publishing a blank index. Cheap to assert.
        run: |
          set -euo pipefail
          test -s doc/index.html
          echo "pages generated: $(find doc -name '*.html' | wc -l)"
          echo "site size: $(du -sh doc | cut -f1)"

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc

  deploy:
    name: publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4